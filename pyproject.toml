[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawnmower"
version = "2.0.0"
description = "Lawn-mowing coverage path planning on a grid: classical planners and an RL environment"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Christophe Louargant" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "matplotlib>=3.7"]

[project.optional-dependencies]
rl = ["gymnasium>=0.29"]
train = ["gymnasium>=0.29", "torch>=2.1"]
dev = ["pytest>=7", "gymnasium>=0.29"]

[project.scripts]
lawnmower = "lawnmower.__main__:main"

[tool.setuptools.packages.find]
include = ["lawnmower*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
